<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Notizie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  body{margin:0;background:#05080f;font-family:'Nunito',sans-serif;}
  a{color:#F3C969;text-decoration:none;}
  .bg-blur{background-image:url('../assets/home_bg_base.png');background-size:cover;background-position:center 34%;filter:blur(10px) brightness(0.42) saturate(1.1);transform:scale(1.12);}
  .panel{background:linear-gradient(180deg,rgba(10,22,44,0.82),rgba(6,13,27,0.9));border:1px solid rgba(243,201,105,0.25);border-radius:16px;}
  .rb{width:40px;height:40px;box-sizing:border-box;border-radius:20px;background:rgba(11,29,58,0.6);border:1px solid rgba(243,201,105,0.45);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;}
  .gold-btn{border:1px solid rgba(255,255,255,0.5);background:linear-gradient(180deg,#FCE29A 0%,#F3C969 55%,#C4922F 100%);color:#25160A;cursor:pointer;}
  .gold-btn:hover{filter:brightness(1.05);}
  /* hero artwork per story */
  .art-2v2{background:linear-gradient(180deg,rgba(6,13,27,0) 30%,rgba(6,13,27,0.92) 100%),url('../assets/home_bg_base.png') center 40%/cover no-repeat;}
  .art-torneo{background:linear-gradient(180deg,rgba(6,13,27,0) 30%,rgba(6,13,27,0.92) 100%),radial-gradient(circle at 70% 40%,rgba(243,201,105,0.45),rgba(243,201,105,0) 45%),linear-gradient(120deg,#0B1D3A,#1B6B8F 50%,#6B3FA0);}
  .art-dorso{background:linear-gradient(180deg,rgba(6,13,27,0) 30%,rgba(6,13,27,0.92) 100%),radial-gradient(circle at 70% 45%,rgba(39,181,133,0.5),rgba(39,181,133,0) 50%),linear-gradient(135deg,#0E4F3A,#062519);}
  .news:hover{background:rgba(255,255,255,0.03);}
  .scrim{position:absolute;inset:0;border:0;padding:0;margin:0;background:rgba(3,7,16,0.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;}
  @keyframes up{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
  .sheet-up{animation:up .3s cubic-bezier(.2,.8,.3,1) both;}
  @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
  .fade{animation:fadeIn .35s ease-out both;}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;">
  <div class="bg-blur" style="position:absolute;inset:-30px;"></div>

  <div style="position:absolute;top:22px;left:20px;right:20px;display:flex;align-items:center;gap:12px;">
    <a href="Home.dc.html" class="rb" aria-label="Indietro"><img src="../assets/ic_nav_back_cream.png" alt="" style="width:15px;height:15px;"></a>
    <h1 style="flex:1;margin:0;font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:#F5E9D0;">Notizie</h1>
  </div>

  <!-- featured carousel -->
  <div style="position:absolute;top:80px;left:20px;width:350px;height:230px;">
    <sc-for list="{{featured}}" as="f" hint-placeholder-count="1">
      <sc-if value="{{f.on}}" hint-placeholder-val="{{true}}">
        <button type="button" onClick="{{f.open}}" class="fade art-{{f.art}}" style="position:absolute;inset:0;border-radius:20px;border:1px solid rgba(243,201,105,0.45);overflow:hidden;cursor:pointer;padding:0;text-align:left;box-shadow:0 12px 28px rgba(0,0,0,0.5);">
          <sc-if value="{{f.hasPic}}" hint-placeholder-val="{{false}}"><img src="{{f.pic}}" alt="" style="position:absolute;right:{{f.picR}};top:{{f.picT}};width:{{f.picW}};height:auto;transform:rotate({{f.picRot}});filter:drop-shadow(0 10px 16px rgba(0,0,0,0.55));"></sc-if>
          <div style="position:absolute;left:16px;right:16px;bottom:14px;display:flex;flex-direction:column;gap:6px;">
            <span style="align-self:flex-start;height:20px;display:inline-flex;align-items:center;padding:0 8px;border-radius:10px;background:{{f.tagBg}};font-size:9px;font-weight:800;letter-spacing:1px;color:{{f.tagCol}};">{{f.tag}}</span>
            <span style="font-family:'Cinzel',serif;font-size:20px;font-weight:700;color:#F5E9D0;line-height:1.2;text-shadow:0 2px 6px rgba(0,0,0,0.6);">{{f.title}}</span>
            <span style="font-size:12px;color:rgba(245,233,208,0.75);">{{f.sub}}</span>
          </div>
        </button>
      </sc-if>
    </sc-for>
    <button type="button" onClick="{{prev}}" aria-label="Notizia precedente" style="position:absolute;left:8px;top:84px;width:32px;height:32px;border-radius:16px;background:rgba(6,13,27,0.6);border:1px solid rgba(243,201,105,0.35);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;"><img src="../assets/ic_nav_back_cream.png" alt="" style="width:11px;height:11px;"></button>
    <button type="button" onClick="{{next}}" aria-label="Notizia successiva" style="position:absolute;right:8px;top:84px;width:32px;height:32px;border-radius:16px;background:rgba(6,13,27,0.6);border:1px solid rgba(243,201,105,0.35);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;"><img src="../assets/ic_nav_back_cream.png" alt="" style="width:11px;height:11px;transform:scaleX(-1);"></button>
  </div>
  <div style="position:absolute;top:320px;left:0;width:390px;display:flex;justify-content:center;gap:6px;">
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="3"><button type="button" onClick="{{d.pick}}" aria-label="Notizia {{d.n}}" style="width:{{d.w}};height:6px;border-radius:3px;border:0;padding:0;background:{{d.bg}};cursor:pointer;"></button></sc-for>
  </div>

  <!-- list -->
  <div style="position:absolute;top:344px;left:20px;font-family:'Cinzel',serif;font-size:10px;font-weight:600;letter-spacing:2px;color:#F3C969;">ULTIME NOTIZIE</div>
  <div class="panel" style="position:absolute;top:366px;left:20px;width:350px;box-sizing:border-box;padding:4px 0;">
    <sc-for list="{{list}}" as="n" hint-placeholder-count="4">
      <button type="button" class="news" onClick="{{n.open}}" style="width:100%;height:78px;border:0;border-bottom:1px solid rgba(243,201,105,0.08);background:transparent;display:flex;align-items:center;gap:12px;padding:0 12px;cursor:pointer;text-align:left;">
        <div style="width:54px;height:54px;border-radius:12px;background:{{n.thumbBg}};border:1px solid rgba(243,201,105,0.3);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;"><img src="{{n.icon}}" alt="" style="width:{{n.iw}};height:auto;"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;">
          <div style="display:flex;align-items:center;gap:6px;"><span style="height:16px;display:inline-flex;align-items:center;padding:0 6px;border-radius:8px;background:{{n.tagBg}};font-size:8px;font-weight:800;letter-spacing:0.8px;color:{{n.tagCol}};">{{n.tag}}</span><span style="font-size:10px;color:rgba(245,233,208,0.45);">{{n.date}}</span><sc-if value="{{n.isNew}}" hint-placeholder-val="{{false}}"><span style="width:7px;height:7px;border-radius:4px;background:#E5484D;"></span></sc-if></div>
          <span style="font-size:14px;font-weight:800;color:#F5E9D0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{n.title}}</span>
          <span style="font-size:11px;color:rgba(245,233,208,0.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{n.sub}}</span>
        </div>
      </button>
    </sc-for>
  </div>

  <!-- article -->
  <sc-if value="{{articleOpen}}" hint-placeholder-val="{{false}}">
    <button type="button" class="scrim" aria-label="Chiudi notizia" onClick="{{close}}"></button>
    <div role="dialog" aria-modal="true" aria-labelledby="art-title" class="sheet-up" style="position:absolute;left:0;bottom:0;width:390px;height:700px;box-sizing:border-box;background:linear-gradient(180deg,rgba(12,26,50,0.98),rgba(6,13,27,0.99));border-top:1px solid rgba(243,201,105,0.4);border-radius:24px 24px 0 0;overflow:hidden;box-shadow:0 -12px 40px rgba(0,0,0,0.5);">
      <div class="art-{{a.art}}" style="position:relative;height:210px;">
        <sc-if value="{{a.hasPic}}" hint-placeholder-val="{{false}}"><img src="{{a.pic}}" alt="" style="position:absolute;right:{{a.picR}};top:{{a.picT}};width:{{a.picW}};height:auto;transform:rotate({{a.picRot}});filter:drop-shadow(0 10px 16px rgba(0,0,0,0.55));"></sc-if>
        <button type="button" onClick="{{close}}" aria-label="Chiudi" style="position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:17px;background:rgba(6,13,27,0.6);border:1px solid rgba(243,201,105,0.35);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;"><img src="../assets/ic_close_cream.png" alt="" style="width:12px;height:12px;"></button>
      </div>
      <div style="padding:16px 20px 24px;display:flex;flex-direction:column;gap:8px;">
        <div style="display:flex;align-items:center;gap:8px;"><span style="height:20px;display:inline-flex;align-items:center;padding:0 8px;border-radius:10px;background:{{a.tagBg}};font-size:9px;font-weight:800;letter-spacing:1px;color:{{a.tagCol}};">{{a.tag}}</span><span style="font-size:11px;color:rgba(245,233,208,0.5);">{{a.date}}</span></div>
        <h2 id="art-title" style="margin:0;font-family:'Cinzel',serif;font-size:21px;font-weight:700;color:#F5E9D0;line-height:1.25;">{{a.title}}</h2>
        <sc-for list="{{a.body}}" as="p" hint-placeholder-count="2"><p style="margin:0;font-size:13px;line-height:1.6;color:rgba(245,233,208,0.75);">{{p}}</p></sc-for>
      </div>
      <div style="position:absolute;left:20px;right:20px;bottom:24px;">
        <a href="{{a.ctaHref}}" class="gold-btn" style="height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;font-size:14px;letter-spacing:2px;">{{a.cta}}</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"aperta":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0, open: props.aperta === true ? 'f0' : null }; }
  renderVals() {
    const set = (o) => this.setState(o);
    const TAG = { NOVITÀ: ['#F3C969', '#25160A'], TORNEO: ['#4F80E8', '#fff'], COLLEZIONE: ['#27B585', '#062519'], AGGIORNAMENTO: ['rgba(243,201,105,0.18)', '#F3C969'], EVENTO: ['rgba(79,128,232,0.22)', '#9DB8F5'], AVVISO: ['rgba(229,72,77,0.18)', '#F08A8D'], CONSIGLI: ['rgba(39,181,133,0.2)', '#7FE0B8'] };
    const feat = [
      { id: 'f0', art: '2v2', tag: 'NOVITÀ', title: 'Il 2 vs 2 è arrivato!', sub: 'Gioca in coppia con un amico', date: '24 settembre', pic: '', cta: 'GIOCA ORA', ctaHref: 'Home.dc.html',
        body: ['Da oggi puoi sederti al tavolo in coppia: scegli la modalità 2 vs 2 dal pannello Modalità e gioca con un amico o con un compagno trovato online.', 'Il mazziere gira a ogni smazzata e le carte accusate restano visibili dietro al banner: toccale per rivederle.'] },
      { id: 'f1', art: 'torneo', tag: 'TORNEO', title: 'Torneo del weekend', sub: 'Sabato e domenica · premi in forzieri', date: '22 settembre', pic: '../assets/medal_trophy.png', picR: '26px', picT: '26px', picW: '96px', picRot: '8deg', cta: 'ISCRIVITI', ctaHref: 'Home.dc.html',
        body: ['Sfida i migliori giocatori in un torneo a eliminazione. I primi 100 ricevono un forziere, i primi 3 un banner animato esclusivo.', 'Le iscrizioni aprono venerdì alle 18:00.'] },
      { id: 'f2', art: 'dorso', tag: 'COLLEZIONE', title: 'Nuovo dorso: Smeraldo', sub: 'Disponibile nella Collezione', date: '20 settembre', pic: '../assets/back_smeraldo.png', picR: '30px', picT: '18px', picW: '84px', picRot: '10deg', cta: 'VAI ALLA COLLEZIONE', ctaHref: 'Collezione.dc.html',
        body: ['Il dorso Smeraldo si aggiunge alla tua collezione: oro e verde, per un tavolo ancora più elegante.', 'Lo trovi nella scheda Dorsi della Collezione.'] }
    ];
    const list = [
      { id: 'n1', tag: 'AGGIORNAMENTO', title: 'Versione 1.2: banner personalizzati', sub: 'Scegli il banner che vedranno tutti al tavolo', date: '24 set', icon: '../assets/avatar_1.png', iw: '48px', thumb: 'linear-gradient(120deg,#0B1D3A,#1B6B8F,#27B585,#6B3FA0)', isNew: true, art: '2v2',
        body: ['Nel profilo trovi la nuova scheda Banner: alcuni sono statici, altri animati e si sbloccano con i livelli, il pass o nel negozio.', 'Il banner si vede sul tuo banner al tavolo e per intero nel profilo rapido.'], cta: 'VAI AL PROFILO', ctaHref: 'Profilo.dc.html' },
      { id: 'n2', tag: 'EVENTO', title: 'Doppia esperienza nel weekend', sub: 'Ogni partita vale il doppio degli XP', date: '20 set', icon: '../assets/medal_sun.png', iw: '38px', thumb: 'rgba(79,128,232,0.15)', isNew: true, art: 'torneo',
        body: ['Da venerdì a domenica tutte le partite online danno il doppio dell’esperienza. Ottimo momento per salire di livello!'], cta: 'GIOCA ORA', ctaHref: 'Home.dc.html' },
      { id: 'n3', tag: 'AVVISO', title: 'Manutenzione di giovedì', sub: 'Dalle 3:00 alle 4:00 i server saranno fermi', date: '18 set', icon: '../assets/ic_warn_cream.png', iw: '26px', thumb: 'rgba(229,72,77,0.12)', isNew: false, art: 'torneo',
        body: ['Giovedì dalle 3:00 alle 4:00 faremo manutenzione ai server. Le partite in corso verranno salvate.'], cta: 'HO CAPITO', ctaHref: 'Notizie.dc.html' },
      { id: 'n4', tag: 'CONSIGLI', title: 'Quando conviene accusare?', sub: 'Tre consigli per non sprecare l’accuso', date: '15 set', icon: '../assets/pugno.png', iw: '32px', thumb: 'rgba(39,181,133,0.12)', isNew: false, art: 'dorso',
        body: ['L’accuso vale punti subito, ma mostra le tue carte a tutti: pensaci prima di usarlo con carte che ti servono per le prese.'], cta: 'CHIUDI', ctaHref: 'Notizie.dc.html' }
    ];
    const n = feat.length, i = ((this.state.i % n) + n) % n;
    const all = feat.concat(list);
    const a0 = all.find((x) => x.id === this.state.open);
    const deco = (x) => ({ ...x, tagBg: TAG[x.tag][0], tagCol: TAG[x.tag][1], hasPic: !!x.pic });
    return {
      featured: feat.map((f, k) => ({ ...deco(f), on: k === i, open: () => set({ open: f.id }) })),
      dots: feat.map((f, k) => ({ n: String(k + 1), w: k === i ? '22px' : '6px', bg: k === i ? '#F3C969' : 'rgba(245,233,208,0.3)', pick: () => set({ i: k }) })),
      prev: () => set({ i: i - 1 }), next: () => set({ i: i + 1 }),
      list: list.map((x) => ({ ...deco(x), thumbBg: x.thumb, open: () => set({ open: x.id }) })),
      articleOpen: !!a0, close: () => set({ open: null }),
      a: a0 ? deco({ pic: '', picR: '0', picT: '0', picW: '0', picRot: '0deg', ...a0 }) : { art: '2v2', hasPic: false, pic: '', picR: '0', picT: '0', picW: '0', picRot: '0deg', tag: 'NOVITÀ', tagBg: 'none', tagCol: '#fff', date: '', title: '', body: [], cta: '', ctaHref: '#' }
    };
  }
}
</script>
</body>
</html>
