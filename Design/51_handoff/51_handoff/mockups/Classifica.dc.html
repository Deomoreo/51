<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Classifica</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  body{margin:0;background:#05080f;font-family:'Nunito',sans-serif;}
  a{color:#F3C969;text-decoration:none;}
  .bg-blur{background-image:url('../assets/home_bg_base.png');background-size:cover;background-position:center 34%;filter:blur(10px) brightness(0.42) saturate(1.1);transform:scale(1.12);}
  .bg-photo{background-image:url('../assets/home_bg_base.png');background-size:cover;background-position:center 30%;}
  .panel{background:linear-gradient(180deg,rgba(10,22,44,0.82),rgba(6,13,27,0.9));border:1px solid rgba(243,201,105,0.25);border-radius:16px;}
  .sheet{background:linear-gradient(180deg,rgba(14,28,52,0.98),rgba(7,14,28,0.99));border:1px solid rgba(243,201,105,0.5);box-shadow:0 20px 50px rgba(0,0,0,0.6);}
  .cap{font-family:'Cinzel',serif;font-size:10px;font-weight:600;letter-spacing:2px;color:#F3C969;}
  .h1{margin:0;font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:#F5E9D0;line-height:1.15;}
  .rb{width:40px;height:40px;box-sizing:border-box;border-radius:20px;background:rgba(11,29,58,0.6);border:1px solid rgba(243,201,105,0.45);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:none;}
  .gold-btn{border:1px solid rgba(255,255,255,0.5);background:linear-gradient(180deg,#FCE29A 0%,#F3C969 55%,#C4922F 100%);color:#25160A;cursor:pointer;font-family:'Cinzel',serif;font-weight:700;letter-spacing:2px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;}
  .gold-btn:hover{filter:brightness(1.05);}
  .ghost-btn{border:1px solid rgba(243,201,105,0.5);background:transparent;color:#F3C969;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;display:flex;align-items:center;justify-content:center;box-sizing:border-box;}
  .ghost-btn:hover{background:rgba(243,201,105,0.08);}
  .input{width:100%;height:50px;box-sizing:border-box;padding:0 14px 0 44px;border-radius:14px;border:1px solid rgba(243,201,105,0.3);background:rgba(255,255,255,0.06);color:#F5E9D0;font-family:'Nunito',sans-serif;font-size:14px;}
  .input::placeholder{color:rgba(245,233,208,0.45);}
  .input:focus{outline:none;border-color:#F3C969;background:rgba(255,255,255,0.1);}
  .card{border-radius:5px;box-shadow:0 3px 8px rgba(0,0,0,0.45);display:block;background:#fff;}
  .scrim{position:absolute;inset:0;border:0;padding:0;margin:0;background:rgba(3,7,16,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;}
  @keyframes pop{0%{transform:scale(0.8);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .3s ease-out both;}
  @keyframes up{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
  .sheet-up{animation:up .3s cubic-bezier(.2,.8,.3,1) both;}
  @keyframes fadeUp{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
  .fade-up{animation:fadeUp .4s ease-out both;}
  @keyframes pulseRing{0%,100%{box-shadow:0 0 0 0 rgba(243,201,105,0.6)}50%{box-shadow:0 0 0 9px rgba(243,201,105,0)}}
  .pulse{animation:pulseRing 1.6s ease-in-out infinite;}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes rays{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
  .rays{animation:rays 18s linear infinite;}
  @keyframes burst{0%{transform:translate(-50%,-50%) scale(0.2);opacity:0}35%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.15);opacity:0.65}}
  .burst{animation:burst 1s ease-out both;}
  @keyframes wave{0%,100%{transform:translateY(8px) rotate(0)}25%{transform:translateY(-10px) rotate(-4deg)}50%{transform:translateY(-14px) rotate(0)}75%{transform:translateY(-6px) rotate(4deg)}}
  .wave{animation:wave 1.4s ease-in-out infinite;}

</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;">
  <div class="bg-blur" style="position:absolute;inset:-30px;"></div>
  <div style="position:absolute;top:22px;left:20px;right:20px;display:flex;align-items:center;gap:12px;"><a href="Home.dc.html" class="rb" aria-label="Indietro"><img src="../assets/ic_nav_back_cream.png" alt="" style="width:15px;height:15px;"></a><div style="flex:1;display:flex;flex-direction:column;gap:2px;"><h1 class="h1">Classifica</h1><span style="font-size:11px;color:rgba(245,233,208,0.55);">{{resetText}}</span></div></div>
  <div style="position:absolute;top:80px;left:20px;width:350px;box-sizing:border-box;display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(6,13,27,0.7);border:1px solid rgba(243,201,105,0.18);">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <sc-if value="{{t.on}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{t.pick}}" style="flex:1;height:36px;border-radius:9px;background:rgba(243,201,105,0.16);border:1px solid rgba(243,201,105,0.7);color:#F3C969;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;padding:0;">{{t.label}}</button></sc-if>
      <sc-if value="{{t.off}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{t.pick}}" style="flex:1;height:36px;border-radius:9px;background:transparent;border:1px solid transparent;color:rgba(245,233,208,0.7);font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;padding:0;">{{t.label}}</button></sc-if>
    </sc-for>
  </div>
  <!-- podium -->
  <div style="position:absolute;top:140px;left:20px;right:20px;height:190px;display:flex;align-items:flex-end;justify-content:center;gap:10px;">
    <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
      <div style="width:104px;display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="position:relative;"><div style="width:{{p.size}};height:{{p.size}};border-radius:50%;padding:3px;box-sizing:border-box;background:{{p.ring}};box-shadow:{{p.glow}};"><div style="width:100%;height:100%;border-radius:50%;overflow:hidden;background:#0B1D3A;"><img src="{{p.img}}" alt="" style="width:132%;margin:-4% 0 0 -16%;display:block;"></div></div><span style="position:absolute;left:50%;bottom:-8px;margin-left:-12px;width:24px;height:24px;border-radius:12px;background:{{p.medal}};border:2px solid #0B1626;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:11px;font-weight:700;color:#0B1626;">{{p.pos}}</span></div>
        <span style="margin-top:6px;font-size:12px;font-weight:800;color:#F5E9D0;white-space:nowrap;">{{p.name}}</span>
        <div style="width:100%;height:{{p.h}};border-radius:12px 12px 0 0;background:linear-gradient(180deg,{{p.col}},rgba(6,13,27,0.4));border:1px solid rgba(243,201,105,0.3);border-bottom:0;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;box-sizing:border-box;"><span style="font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:#F5E9D0;">{{p.pts}}</span></div>
      </div>
    </sc-for>
  </div>
  <div class="panel" style="position:absolute;top:340px;left:20px;width:350px;box-sizing:border-box;padding:2px 0;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid rgba(243,201,105,0.08);">
        <span style="width:24px;font-family:'Cinzel',serif;font-size:13px;font-weight:700;color:rgba(245,233,208,0.6);">{{r.pos}}</span>
        <div style="width:34px;height:34px;border-radius:50%;padding:2px;box-sizing:border-box;background:conic-gradient(from 20deg,#4F80E8,#F3C969,#1B3A7A,#FCE29A,#4F80E8);flex:none;"><div style="width:100%;height:100%;border-radius:50%;overflow:hidden;background:#0B1D3A;"><img src="{{r.img}}" alt="" style="width:132%;margin:-4% 0 0 -16%;display:block;"></div></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:1px;min-width:0;"><span style="font-size:13px;font-weight:800;color:#F5E9D0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{r.name}}</span><span style="font-size:10px;color:rgba(245,233,208,0.5);">Liv. {{r.level}}</span></div>
        <span style="font-family:'Cinzel',serif;font-size:14px;font-weight:700;color:#F5E9D0;">{{r.pts}}</span>
      </div>
    </sc-for>
  </div>
  <!-- my position pinned -->
  <div style="position:absolute;left:20px;right:20px;bottom:100px;height:58px;box-sizing:border-box;border-radius:16px;background:linear-gradient(180deg,rgba(243,201,105,0.2),rgba(12,26,50,0.95));border:1.5px solid #F3C969;display:flex;align-items:center;gap:10px;padding:0 14px;">
    <span style="width:30px;font-family:'Cinzel',serif;font-size:14px;font-weight:700;color:#FCE29A;">{{myPos}}</span>
    <div style="width:38px;height:38px;border-radius:50%;padding:2px;box-sizing:border-box;background:conic-gradient(from 20deg,#FCE29A,#C4922F,#FFF1C4,#8A5A12,#FCE29A);flex:none;"><div style="width:100%;height:100%;border-radius:50%;overflow:hidden;background:#0B1D3A;"><img src="../assets/avatar_1.png" alt="" style="width:132%;margin:-4% 0 0 -16%;display:block;"></div></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:1px;"><span style="font-size:13px;font-weight:800;color:#F5E9D0;">Tu · GiocatoreNapo</span><span style="font-size:10px;color:#F3C969;">{{myNote}}</span></div>
    <span style="font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:#FCE29A;">{{myPts}}</span>
  </div>
  <div style="position:absolute;left:20px;right:20px;bottom:30px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;border:1px dashed rgba(243,201,105,0.35);background:rgba(6,13,27,0.55);">
    <img src="../assets/chest_purple.png" alt="" style="width:40px;height:auto;flex:none;"><span style="font-size:11px;line-height:1.4;color:rgba(245,233,208,0.7);">Primi 3: forziere viola · primi 10: forziere verde · primi 100: 200 monete</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'settimana' }; }
  renderVals() {
    const A = ["../assets/avatar_1.png", "../assets/av_2.png", "../assets/av_3.png", "../assets/av_4.png", "../assets/av_5.png", "../assets/av_6.png", "../assets/av_7.png", "../assets/av_8.png"], GOLD = 'conic-gradient(from 20deg,#FCE29A,#C4922F,#FFF1C4,#8A5A12,#FCE29A)', BLUE = 'conic-gradient(from 20deg,#4F80E8,#F3C969,#1B3A7A,#FCE29A,#4F80E8)';
    const sets = {
      settimana: { reset: 'Si azzera tra 2 giorni e 4 ore', top: [['Nonna_Rosa', A[7], 2840], ['Capitano_Nemo', A[2], 2615], ['Marco_93', A[3], 2410]], rows: [['Giulia', A[1], 15, 2205], ['Arlecchino', A[5], 7, 2100], ['Zingara_77', A[4], 11, 1980], ['Ramina', A[6], 6, 1875], ['Tore_NA', A[4], 9, 1760], ['Re_di_Denari', A[2], 21, 1690]], my: ['#14', 1520, 'Ti mancano 170 punti per la top 10'] },
      amici: { reset: 'I tuoi amici questa settimana', top: [['Marco_93', A[3], 2410], ['Giulia', A[1], 2205], ['Tu', A[0], 1520]], rows: [['Tore_NA', A[4], 9, 1760], ['Capitano_Nemo', A[2], 22, 1200], ['Arlecchino', A[5], 7, 980], ['Nonna_Rosa', A[7], 31, 640]], my: ['#3', 1520, 'Sul podio dei tuoi amici!'] },
      sempre: { reset: 'Classifica di sempre', top: [['Re_di_Denari', A[2], 98400], ['Nonna_Rosa', A[7], 91250], ['Scopone', A[3], 88120]], rows: [['Capitano_Nemo', A[2], 22, 80310], ['Asso_Furbo', A[1], 19, 77005], ['Marco_93', A[3], 18, 70990], ['Settebello_11', A[4], 17, 65230], ['Giulia', A[1], 15, 60110], ['Arlecchino', A[5], 7, 54880]], my: ['#1.204', 8420, 'Top 8% dei giocatori'] }
    };
    const s = sets[this.state.tab];
    const order = [1, 0, 2];
    const med = ['linear-gradient(180deg,#FCE29A,#C4922F)', 'linear-gradient(180deg,#F2F2F2,#9AA3AF)', 'linear-gradient(180deg,#E8B07A,#9A5B2A)'];
    const fmt = (n) => n.toLocaleString('it-IT');
    return {
      resetText: s.reset,
      tabs: [ ['settimana', 'Settimana'], ['amici', 'Amici'], ['sempre', 'Sempre'] ].map((t) => ({ label: t[1], on: t[0] === this.state.tab, off: t[0] !== this.state.tab, pick: () => this.setState({ tab: t[0] }) })),
      podium: order.map((i) => ({ pos: String(i + 1), name: s.top[i][0], img: s.top[i][1], pts: fmt(s.top[i][2]), medal: med[i], ring: i === 0 ? GOLD : BLUE, size: i === 0 ? '76px' : '62px', glow: i === 0 ? '0 0 22px rgba(243,201,105,0.55)' : 'none', h: i === 0 ? '70px' : (i === 1 ? '52px' : '40px'), col: i === 0 ? 'rgba(243,201,105,0.35)' : 'rgba(79,128,232,0.25)' })),
      rows: s.rows.map((r, i) => ({ pos: String(i + 4), name: r[0], img: r[1], level: String(r[2]), pts: fmt(r[3]) })),
      myPos: s.my[0], myPts: fmt(s.my[1]), myNote: s.my[2]
    };
  }
}
</script>
</body>
</html>
