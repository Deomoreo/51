<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  body{margin:0;background:#05080f;font-family:'Nunito',sans-serif;}
  a{color:#F3C969;text-decoration:none;}
  a:hover{color:#FFE3A3;text-decoration:underline;}
  .bg-photo{
    background-image:url('../assets/home_bg_base.png');
    background-size:cover;
    background-position:center 30%;
  }
  .overlay-gradient{
    background:linear-gradient(180deg, rgba(6,14,28,0.22) 0%, rgba(6,14,28,0.08) 26%, rgba(5,11,24,0.52) 54%, rgba(4,9,20,0.86) 78%, rgba(3,7,16,0.96) 100%);
  }
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  .login-input::placeholder{color:rgba(245,233,208,0.45);}
  .login-input:focus{outline:none;border-color:{{accent}};background:rgba(255,255,255,0.1);}
  .cta-btn:hover{filter:brightness(1.05);}
  .ghost-btn:hover{background:rgba(255,255,255,0.12);}
</style>
</helmet>

<div class="bg-photo" style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;">

  <div class="overlay-gradient" style="position:absolute;inset:0;z-index:1;"></div>

  <button type="button" aria-label="Cambia lingua" style="position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:22px;background:rgba(11,29,58,0.55);border:1px solid rgba(243,201,105,0.45);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;z-index:5;">
    <img src="../assets/ic_globe_cream.png" alt="" style="width:22px;height:22px;">
  </button>

  <div style="position:absolute;top:140px;left:0;width:390px;height:240px;z-index:2;">
    <img src="../assets/Bagliore_morbido.png" alt="" style="position:absolute;top:50%;left:50%;width:320px;height:320px;transform:translate(-50%,-50%);opacity:0.85;pointer-events:none;">
    <img src="../assets/logo_51.png" alt="51 - il gioco di carte napoletano" style="position:absolute;top:50%;left:50%;width:182px;height:auto;transform:translate(-50%,-50%);">
  </div>

  <div style="position:absolute;left:0;bottom:0;width:390px;box-sizing:border-box;padding:24px 22px 22px;display:flex;flex-direction:column;gap:13px;background:linear-gradient(180deg, rgba(8,17,34,0.4) 0%, rgba(7,15,30,0.88) 22%, rgba(5,11,23,0.96) 100%);border-top:1px solid rgba(243,201,105,0.3);border-radius:26px 26px 0 0;z-index:3;">

    <div style="position:relative;">
      <label for="login-id" class="sr-only">Email o nome utente</label>
      <img src="../assets/ic_mail.png" alt="" style="position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:0.9;">
      <input id="login-id" type="text" placeholder="Email o nome utente" class="login-input" style="width:100%;height:50px;box-sizing:border-box;padding:0 14px 0 44px;border-radius:14px;border:1px solid rgba(243,201,105,0.3);background:rgba(255,255,255,0.06);color:#F5E9D0;font-family:'Nunito',sans-serif;font-size:14px;">
    </div>

    <div style="position:relative;">
      <label for="login-pw" class="sr-only">Password</label>
      <img src="../assets/ic_lock_cream.png" alt="" style="position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:0.9;">
      <input id="login-pw" type="password" placeholder="Password" class="login-input" style="width:100%;height:50px;box-sizing:border-box;padding:0 14px 0 44px;border-radius:14px;border:1px solid rgba(243,201,105,0.3);background:rgba(255,255,255,0.06);color:#F5E9D0;font-family:'Nunito',sans-serif;font-size:14px;">
    </div>

    <div style="display:flex;justify-content:flex-end;margin-top:-4px;">
      <a href="PasswordDimenticata.dc.html" style="font-family:'Nunito',sans-serif;font-size:12px;font-weight:600;">Password dimenticata?</a>
    </div>

    <button type="button" class="cta-btn" style="width:100%;height:54px;border-radius:16px;border:1px solid rgba(255,255,255,0.5);background:linear-gradient(180deg,#FCE29A 0%,{{accent}} 55%,#C4922F 100%);font-family:'Cinzel',serif;font-weight:700;font-size:15px;letter-spacing:2px;color:#25160A;box-shadow:0 8px 18px rgba(0,0,0,0.35);cursor:pointer;">ACCEDI</button>

    <div style="display:flex;align-items:center;gap:10px;">
      <div style="flex:1;height:1px;background:rgba(255,255,255,0.18);"></div>
      <span style="font-family:'Nunito',sans-serif;font-size:11px;letter-spacing:1px;color:rgba(245,233,208,0.55);text-transform:uppercase;">oppure</span>
      <div style="flex:1;height:1px;background:rgba(255,255,255,0.18);"></div>
    </div>

    <a href="Registrazione.dc.html" class="ghost-btn" style="width:100%;height:50px;box-sizing:border-box;border-radius:14px;border:1px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:#F5E9D0;">Registrati</a>

    <a href="#" style="text-align:center;font-family:'Nunito',sans-serif;font-size:13px;color:rgba(245,233,208,0.8);text-decoration:underline;margin-top:2px;">Continua come ospite</a>

    <div style="text-align:center;font-family:'Nunito',sans-serif;font-size:10px;color:rgba(245,233,208,0.4);margin-top:2px;">Versione 0.1.0</div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F3C969"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#F3C969'
    };
  }
}
</script>
</body>
</html>
