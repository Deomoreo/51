  @keyframes up{0%{transform:translateY(100%)}100%{transform:translateY(0)}}

  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  @keyframes aceIn{0%{transform:translateY(-80px) scale(0.6);opacity:0}100%{opacity:1}}
  .ace{animation:aceIn .5s cubic-bezier(.3,.7,.3,1.2) both;}
</style>

  renderVals() {

}
