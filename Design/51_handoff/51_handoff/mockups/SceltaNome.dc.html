<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Scegli il nome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  body{margin:0;background:#05080f;font-family:'Nunito',sans-serif;}
  a{color:#F3C969;text-decoration:none;}
  .bg-blur{background-image:url('../assets/home_bg_base.png');background-size:cover;background-position:center 34%;filter:blur(10px) brightness(0.42) saturate(1.1);transform:scale(1.12);}
  .bg-photo{background-image:url('../assets/home_bg_base.png');background-size:cover;background-position:center 30%;}
  .panel{background:linear-gradient(180deg,rgba(10,22,44,0.82),rgba(6,13,27,0.9));border:1px solid rgba(243,201,105,0.25);border-radius:16px;}
  .sheet{background:linear-gradient(180deg,rgba(14,28,52,0.98),rgba(7,14,28,0.99));border:1px solid rgba(243,201,105,0.5);box-shadow:0 20px 50px rgba(0,0,0,0.6);}
  .cap{font-family:'Cinzel',serif;font-size:10px;font-weight:600;letter-spacing:2px;color:#F3C969;}
  .h1{margin:0;font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:#F5E9D0;line-height:1.15;}
  .rb{width:40px;height:40px;box-sizing:border-box;border-radius:20px;background:rgba(11,29,58,0.6);border:1px solid rgba(243,201,105,0.45);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:none;}
  .gold-btn{border:1px solid rgba(255,255,255,0.5);background:linear-gradient(180deg,#FCE29A 0%,#F3C969 55%,#C4922F 100%);color:#25160A;cursor:pointer;font-family:'Cinzel',serif;font-weight:700;letter-spacing:2px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;}
  .gold-btn:hover{filter:brightness(1.05);}
  .ghost-btn{border:1px solid rgba(243,201,105,0.5);background:transparent;color:#F3C969;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;display:flex;align-items:center;justify-content:center;box-sizing:border-box;}
  .ghost-btn:hover{background:rgba(243,201,105,0.08);}
  .input{width:100%;height:50px;box-sizing:border-box;padding:0 14px 0 44px;border-radius:14px;border:1px solid rgba(243,201,105,0.3);background:rgba(255,255,255,0.06);color:#F5E9D0;font-family:'Nunito',sans-serif;font-size:14px;}
  .input::placeholder{color:rgba(245,233,208,0.45);}
  .input:focus{outline:none;border-color:#F3C969;background:rgba(255,255,255,0.1);}
  .card{border-radius:5px;box-shadow:0 3px 8px rgba(0,0,0,0.45);display:block;background:#fff;}
  .scrim{position:absolute;inset:0;border:0;padding:0;margin:0;background:rgba(3,7,16,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;}
  @keyframes pop{0%{transform:scale(0.8);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .3s ease-out both;}
  @keyframes up{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
  .sheet-up{animation:up .3s cubic-bezier(.2,.8,.3,1) both;}
  @keyframes fadeUp{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
  .fade-up{animation:fadeUp .4s ease-out both;}
  @keyframes pulseRing{0%,100%{box-shadow:0 0 0 0 rgba(243,201,105,0.6)}50%{box-shadow:0 0 0 9px rgba(243,201,105,0)}}
  .pulse{animation:pulseRing 1.6s ease-in-out infinite;}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes rays{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
  .rays{animation:rays 18s linear infinite;}
  @keyframes burst{0%{transform:translate(-50%,-50%) scale(0.2);opacity:0}35%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.15);opacity:0.65}}
  .burst{animation:burst 1s ease-out both;}
  @keyframes wave{0%,100%{transform:translateY(8px) rotate(0)}25%{transform:translateY(-10px) rotate(-4deg)}50%{transform:translateY(-14px) rotate(0)}75%{transform:translateY(-6px) rotate(4deg)}}
  .wave{animation:wave 1.4s ease-in-out infinite;}

</style>
</helmet>
<div class="bg-photo" style="width:390px;height:844px;position:relative;overflow:hidden;">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,14,28,0.35) 0%,rgba(5,11,24,0.6) 28%,rgba(4,9,20,0.92) 55%,rgba(3,7,16,0.98) 100%);"></div>
  <div style="position:absolute;top:56px;left:0;width:390px;display:flex;flex-direction:column;align-items:center;gap:6px;">
    <span class="cap" style="letter-spacing:3px;">ULTIMO PASSO</span>
    <h1 class="h1" style="font-size:24px;">Come ti chiamano al tavolo?</h1>
  </div>
  <div style="position:absolute;top:126px;left:0;width:390px;display:flex;justify-content:center;">
    <div style="position:relative;width:118px;height:118px;"><img src="../assets/Bagliore_morbido.png" alt="" style="position:absolute;left:50%;top:50%;width:200px;height:200px;transform:translate(-50%,-50%);opacity:0.6;"><div style="position:relative;width:118px;height:118px;border-radius:50%;padding:5px;box-sizing:border-box;background:conic-gradient(from 20deg,#FCE29A,#C4922F,#FFF1C4,#8A5A12,#FCE29A);"><div style="width:100%;height:100%;border-radius:50%;overflow:hidden;background:#0B1D3A;"><img src="{{avImg}}" alt="Avatar scelto" style="width:132%;margin:-4% 0 0 -16%;display:block;"></div></div></div>
  </div>
  <div style="position:absolute;top:262px;left:0;width:390px;display:flex;justify-content:center;gap:10px;">
    <sc-for list="{{avs}}" as="a" hint-placeholder-count="5"><button type="button" onClick="{{a.pick}}" aria-label="Scegli avatar" style="width:50px;height:50px;border-radius:25px;padding:2px;border:0;background:{{a.ring}};cursor:pointer;box-shadow:{{a.glow}};"><div style="width:100%;height:100%;border-radius:50%;overflow:hidden;background:#0B1D3A;"><img src="{{a.img}}" alt="" style="width:132%;margin:-4% 0 0 -16%;display:block;"></div></button></sc-for>
  </div>
  <div style="position:absolute;left:22px;right:22px;top:344px;display:flex;flex-direction:column;gap:10px;">
    <label for="nick" class="cap">NOME GIOCATORE</label>
    <div style="position:relative;"><img src="../assets/ic_person_cream.png" alt="" style="position:absolute;left:14px;top:15px;width:17px;height:20px;"><input id="nick" class="input" type="text" value="{{name}}" onInput="{{onName}}" maxlength="16" style="padding-right:44px;border-color:{{stateBorder}};"><span style="position:absolute;right:14px;top:14px;width:22px;height:22px;border-radius:11px;background:{{stateBg}};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;">{{stateIcon}}</span></div>
    <span style="font-size:12px;color:{{stateCol}};">{{stateText}}</span>
    <div style="display:flex;flex-wrap:wrap;gap:6px;"><span style="font-size:11px;color:rgba(245,233,208,0.5);align-self:center;">Suggeriti:</span><sc-for list="{{sugg}}" as="s" hint-placeholder-count="3"><button type="button" onClick="{{s.pick}}" style="height:28px;padding:0 10px;border-radius:14px;border:1px solid rgba(243,201,105,0.35);background:rgba(255,255,255,0.05);color:#F5E9D0;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;">{{s.label}}</button></sc-for></div>
    <span style="font-size:11px;line-height:1.45;color:rgba(245,233,208,0.45);">Da 3 a 16 caratteri: lettere, numeri e trattino basso. Potrai cambiarlo una volta gratis dal profilo.</span>
  </div>
  <div style="position:absolute;left:22px;right:22px;bottom:30px;">
    <sc-if value="{{ok}}" hint-placeholder-val="{{true}}"><a href="Benvenuto.dc.html" class="gold-btn" style="height:54px;border-radius:16px;font-size:15px;">CONTINUA</a></sc-if>
    <sc-if value="{{notOk}}" hint-placeholder-val="{{false}}"><div style="height:54px;border-radius:16px;background:rgba(243,201,105,0.15);border:1px solid rgba(243,201,105,0.3);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;font-size:15px;letter-spacing:2px;color:rgba(245,233,208,0.4);">CONTINUA</div></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { name: 'GiocatoreNapo', av: 0 }; }
  renderVals() {
    const AV = ["../assets/avatar_1.png", "../assets/av_2.png", "../assets/av_3.png", "../assets/av_4.png", "../assets/av_5.png"], GOLD = 'conic-gradient(from 20deg,#FCE29A,#C4922F,#FFF1C4,#8A5A12,#FCE29A)';
    const n = this.state.name.trim();
    const taken = ['Marco_93', 'Giulia', 'Tore_NA', 'Scopone'].map((x) => x.toLowerCase()).includes(n.toLowerCase());
    const valid = /^[A-Za-z0-9_]{3,16}$/.test(n);
    const ok = valid && !taken;
    return {
      avImg: AV[this.state.av],
      avs: AV.map((img, i) => ({ img: img, ring: i === this.state.av ? GOLD : 'rgba(243,201,105,0.25)', glow: i === this.state.av ? '0 0 14px rgba(243,201,105,0.55)' : 'none', pick: () => this.setState({ av: i }) })),
      name: this.state.name, onName: (e) => this.setState({ name: e.target.value }),
      stateIcon: ok ? '✓' : '!', stateBg: ok ? '#27B585' : '#E5484D', stateBorder: ok ? 'rgba(127,224,184,0.6)' : 'rgba(229,72,77,0.6)', stateCol: ok ? '#7FE0B8' : '#F08A8D',
      stateText: ok ? 'Disponibile!' : (taken ? 'Questo nome è già preso' : 'Usa da 3 a 16 caratteri, senza spazi'),
      sugg: ['Re_di_Denari', 'Asso_Furbo', 'Settebello_' + (10 + this.state.av)].map((s) => ({ label: s, pick: () => this.setState({ name: s }) })),
      ok: ok, notOk: !ok
    };
  }
}
</script>
</body>
</html>
