<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Livello su</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  body{margin:0;background:#05080f;font-family:'Nunito',sans-serif;}
  a{color:#F3C969;text-decoration:none;}
  .bg-blur{background-image:url('../assets/home_bg_base.png');background-size:cover;background-position:center 34%;filter:blur(10px) brightness(0.42) saturate(1.1);transform:scale(1.12);}
  .bg-photo{background-image:url('../assets/home_bg_base.png');background-size:cover;background-position:center 30%;}
  .panel{background:linear-gradient(180deg,rgba(10,22,44,0.82),rgba(6,13,27,0.9));border:1px solid rgba(243,201,105,0.25);border-radius:16px;}
  .sheet{background:linear-gradient(180deg,rgba(14,28,52,0.98),rgba(7,14,28,0.99));border:1px solid rgba(243,201,105,0.5);box-shadow:0 20px 50px rgba(0,0,0,0.6);}
  .cap{font-family:'Cinzel',serif;font-size:10px;font-weight:600;letter-spacing:2px;color:#F3C969;}
  .h1{margin:0;font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:#F5E9D0;line-height:1.15;}
  .rb{width:40px;height:40px;box-sizing:border-box;border-radius:20px;background:rgba(11,29,58,0.6);border:1px solid rgba(243,201,105,0.45);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:none;}
  .gold-btn{border:1px solid rgba(255,255,255,0.5);background:linear-gradient(180deg,#FCE29A 0%,#F3C969 55%,#C4922F 100%);color:#25160A;cursor:pointer;font-family:'Cinzel',serif;font-weight:700;letter-spacing:2px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;}
  .gold-btn:hover{filter:brightness(1.05);}
  .ghost-btn{border:1px solid rgba(243,201,105,0.5);background:transparent;color:#F3C969;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;display:flex;align-items:center;justify-content:center;box-sizing:border-box;}
  .ghost-btn:hover{background:rgba(243,201,105,0.08);}
  .input{width:100%;height:50px;box-sizing:border-box;padding:0 14px 0 44px;border-radius:14px;border:1px solid rgba(243,201,105,0.3);background:rgba(255,255,255,0.06);color:#F5E9D0;font-family:'Nunito',sans-serif;font-size:14px;}
  .input::placeholder{color:rgba(245,233,208,0.45);}
  .input:focus{outline:none;border-color:#F3C969;background:rgba(255,255,255,0.1);}
  .card{border-radius:5px;box-shadow:0 3px 8px rgba(0,0,0,0.45);display:block;background:#fff;}
  .scrim{position:absolute;inset:0;border:0;padding:0;margin:0;background:rgba(3,7,16,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;}
  @keyframes pop{0%{transform:scale(0.8);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .3s ease-out both;}
  @keyframes up{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
  .sheet-up{animation:up .3s cubic-bezier(.2,.8,.3,1) both;}
  @keyframes fadeUp{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
  .fade-up{animation:fadeUp .4s ease-out both;}
  @keyframes pulseRing{0%,100%{box-shadow:0 0 0 0 rgba(243,201,105,0.6)}50%{box-shadow:0 0 0 9px rgba(243,201,105,0)}}
  .pulse{animation:pulseRing 1.6s ease-in-out infinite;}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes rays{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
  .rays{animation:rays 18s linear infinite;}
  @keyframes burst{0%{transform:translate(-50%,-50%) scale(0.2);opacity:0}35%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.15);opacity:0.65}}
  .burst{animation:burst 1s ease-out both;}
  @keyframes wave{0%,100%{transform:translateY(8px) rotate(0)}25%{transform:translateY(-10px) rotate(-4deg)}50%{transform:translateY(-14px) rotate(0)}75%{transform:translateY(-6px) rotate(4deg)}}
  .wave{animation:wave 1.4s ease-in-out infinite;}
  @keyframes lvlIn{0%{transform:scale(0.3) rotate(-20deg);opacity:0}55%{transform:scale(1.15) rotate(4deg);opacity:1}70%{transform:scale(0.96)}100%{transform:scale(1) rotate(0)}}
  .lvl{animation:lvlIn .7s cubic-bezier(.3,.7,.3,1) both;}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#07101f;">
  <div class="bg-blur" style="position:absolute;inset:-30px;filter:blur(14px) brightness(0.3);"></div>
  <div class="rays" style="position:absolute;left:50%;top:250px;width:600px;height:600px;border-radius:50%;background:repeating-conic-gradient(rgba(243,201,105,0.18) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 65%);mask:radial-gradient(circle,#000 0,transparent 65%);"></div>
  <img src="../assets/Bagliore_morbido.png" alt="" class="burst" style="position:absolute;left:50%;top:250px;width:380px;height:380px;">
  <div class="pop" style="position:absolute;top:90px;left:0;width:390px;display:flex;flex-direction:column;align-items:center;gap:4px;"><span class="cap" style="letter-spacing:3px;">NUOVO LIVELLO</span><span style="font-family:'Cinzel',serif;font-size:30px;font-weight:700;color:#F5E9D0;">Sei salito di livello!</span></div>
  <div class="lvl" style="position:absolute;left:125px;top:180px;width:140px;height:140px;border-radius:70px;background:linear-gradient(180deg,#FCE29A,#C4922F);border:4px solid #FFF1C4;box-shadow:0 0 40px rgba(243,201,105,0.7),0 12px 28px rgba(0,0,0,0.6);display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <span style="font-family:'Cinzel',serif;font-size:13px;font-weight:700;letter-spacing:2px;color:rgba(37,22,10,0.7);">LIVELLO</span>
    <span style="font-family:'Cinzel',serif;font-size:58px;font-weight:700;color:#25160A;line-height:1;">{{lvl}}</span>
  </div>
  <span class="fade-up" style="position:absolute;left:0;width:390px;top:340px;text-align:center;font-size:13px;font-weight:700;color:#F3C969;animation-delay:.6s;">Titolo nuovo: Esperto → Maestro di tavolo</span>
  <div class="fade-up" style="position:absolute;left:20px;right:20px;top:384px;display:flex;flex-direction:column;gap:10px;animation-delay:.9s;">
    <span class="cap">HAI SBLOCCATO</span>
    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;">
      <div class="panel" style="height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-color:rgba(243,201,105,0.5);"><div style="width:58px;height:58px;border-radius:50%;padding:5px;box-sizing:border-box;background:conic-gradient(from 20deg,#E5484D,#F3C969,#7A151D,#FCE29A,#E5484D);"><div style="width:100%;height:100%;border-radius:50%;overflow:hidden;background:#0B1D3A;"><img src="../assets/avatar_1.png" alt="" style="width:132%;margin:-4% 0 0 -16%;display:block;"></div></div><span style="font-size:11px;font-weight:800;color:#F5E9D0;">Cornice Rubino</span><span style="font-size:9px;font-weight:800;color:#9DB8F5;">RARA</span></div>
      <div class="panel" style="height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;"><img src="../assets/ic_coin.png" alt="" style="width:46px;height:46px;"><span style="font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:#FCE29A;">+250</span><span style="font-size:9px;font-weight:800;color:rgba(245,233,208,0.5);">MONETE</span></div>
      <div class="panel" style="height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;"><img src="../assets/chest_green.png" alt="" style="width:60px;height:auto;"><span style="font-size:11px;font-weight:800;color:#F5E9D0;">Forziere verde</span><span style="font-size:9px;font-weight:800;color:rgba(245,233,208,0.5);">DA APRIRE</span></div>
    </div>
    <div class="panel" style="padding:12px 14px;display:flex;align-items:center;gap:10px;margin-top:4px;"><span style="font-size:11px;font-weight:800;color:#F5E9D0;white-space:nowrap;">Liv. 13</span><div style="flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,0.12);overflow:hidden;"><div style="width:8%;height:100%;background:linear-gradient(90deg,#C4922F,#FCE29A);"></div></div><span style="font-size:11px;color:rgba(245,233,208,0.6);white-space:nowrap;">80 / 1100 XP</span></div>
  </div>
  <div class="fade-up" style="position:absolute;left:20px;right:20px;bottom:28px;display:flex;flex-direction:column;gap:10px;animation-delay:1.1s;">
    <a href="Forziere.dc.html" class="gold-btn" style="height:54px;border-radius:16px;font-size:15px;">APRI IL FORZIERE</a>
    <a href="Home.dc.html" class="ghost-btn" style="height:46px;border-radius:14px;font-size:14px;">Più tardi</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lvl: 12 }; setTimeout(() => this.setState({ lvl: 13 }), 650); }
  renderVals() { return { lvl: String(this.state.lvl) }; }
}
</script>
</body>
</html>
